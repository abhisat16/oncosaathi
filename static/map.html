<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Directory</title>
<style>
  :root { --ink:#1d2b36; --muted:#5f6b7a; --line:#dfe5ea; --bg:#f6f8f9; --card:#fff; --accent:#0f6e56;
          --MB:#7b4fa8; --GJB:#2f8f3e; --AB:#c62828; --HBB:#1f5fa8; --SB:#e07a1f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--accent); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; font-size:13px; opacity:.9; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .layout { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:16px; }
  .layout img { width:100%; height:auto; display:block; border-radius:8px; }
  .layout small { color:var(--muted); display:block; margin-top:6px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .bar input { flex:1 1 220px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .bar button { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:14px; cursor:pointer; }
  .bar button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .bldg { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .bldg h2 { margin:0; padding:10px 14px; font-size:16px; color:#fff; }
  .bldg .role { font-weight:400; font-size:13px; opacity:.9; margin-left:6px; }
  .floor { padding:8px 14px; border-top:1px solid var(--line); }
  .floor h3 { margin:2px 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .unit { padding:6px 0; border-bottom:1px dashed var(--line); }
  .unit:last-child { border-bottom:0; }
  .unit b { font-size:15px; } .unit .hi { color:var(--muted); font-size:13px; margin-left:4px; }
  .unit .room { display:inline-block; font-size:12px; background:#eef3f1; color:var(--accent); border-radius:6px; padding:1px 7px; margin-left:6px; }
  .unit .meta { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.45; }
  .staff { opacity:.6; }
  .general { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; margin-bottom:14px; }
  .general h2 { font-size:16px; margin:6px 0; }
  footer { font-size:12px; color:var(--muted); padding:8px 16px 24px; max-width:1000px; margin:0 auto; }
  .empty { color:var(--muted); padding:12px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Tata Memorial Hospital, Parel: hospital directory</h1>
  <p>Every department OncoSaathi knows, building by building. General category first; Private locations in the notes.</p>
</header>
<main>
  <div class="layout">
    <img src="/building_layout.jpg" alt="Campus drawing showing the Main Building (MB), Homi Bhabha Building (HBB), Service Building (SB), Annexe Building (AB) and Golden Jubilee Building (GJB)">
    <small>Building layout from the Tata Memorial Hospital patient booklet.</small>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search: MRI, dispensary, breast, कीमो…" aria-label="Search departments">
    <div id="filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div id="list"></div>
</main>
<footer id="src"></footer>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let H = null, only = "";
const ORDER = ["B", "G", "1", "2", "3", "4", "5", "6", "7", "8"];

function matches(u, q) {
  if (!q) return true;
  const hay = [u.name, u.name_hi, u.rooms, u.note, u.note_hi, u.hours].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}

function unitHtml(u) {
  const meta = [u.hours && `⏱ ${esc(u.hours)}`, u.bring && `Bring: ${esc(u.bring)}`, u.note && esc(u.note)].filter(Boolean).join("<br>");
  return `<div class="unit ${u.public === false ? "staff" : ""}"><b>${esc(u.name)}</b><span class="hi">${esc(u.name_hi)}</span>` +
         (u.rooms ? `<span class="room">${esc(u.rooms)}</span>` : "") + (u.public === false ? `<span class="room">staff only</span>` : "") +
         (meta ? `<div class="meta">${meta}</div>` : "") + `</div>`;
}

function render() {
  const q = document.getElementById("q").value.trim();
  let html = "";
  for (const b of H.blocks) {
    if (only && only !== b.id) continue;
    const floors = ORDER.map((fid) => [fid, H.units.filter((u) => u.block === b.id && u.floor === fid && matches(u, q))]).filter(([, us]) => us.length);
    if (!floors.length) continue;
    html += `<section class="bldg"><h2 style="background:var(--${b.id})">${esc(b.name)}<span class="role">${esc(b.role)}</span></h2>`;
    for (const [fid, us] of floors) {
      const f = H.floors.find((x) => x.id === fid);
      html += `<div class="floor"><h3>${esc(f.name)} · ${esc(f.name_hi)}</h3>${us.map(unitHtml).join("")}</div>`;
    }
    html += `</section>`;
  }
  const gen = H.campus.filter((u) => matches(u, q));
  if (!only && gen.length) html += `<section class="general"><h2>More than one building, or room on your slip</h2>${gen.map(unitHtml).join("")}</section>`;
  document.getElementById("list").innerHTML = html || `<div class="empty">Nothing found. Ask at the ${esc(H.enquiry)}</div>`;
}

fetch("/api/hospital").then((r) => r.json()).then((h) => {
  H = h;
  document.getElementById("title").textContent = `${h.name}: hospital directory`;
  document.getElementById("src").textContent = `Source: ${h.source} ${h.disclaimer}`;
  const f = document.getElementById("filters");
  f.innerHTML = [`<button class="on" data-b="">All</button>`].concat(h.blocks.map((b) => `<button data-b="${b.id}">${b.id}</button>`)).join("");
  f.addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    only = btn.dataset.b; f.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === btn)); render();
  });
  document.getElementById("q").addEventListener("input", render);
  render();
});
</script>
</body>
</html>
